<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where Did the Sigmas Start and Where Are They Now?</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
  background: #f0ede8;
  min-height: 100vh;
  padding: 0 0 3rem;
  color: #222;
  position: relative;
}

/* ── HEADER ──
   Layout: [Burke img] | [column: title / photos+reset]
   The right column stacks title text on top, then faces filling the width, then reset at end of face row
*/
.page-header {
  background: white;
  border-bottom: 1px solid #ddd;
  padding: 0.75rem 1.25rem;
}
.header-row {
  display: flex;
  align-items: stretch;
  gap: 18px;
  max-width: 1200px;
  margin: 0 auto;
}

/* Burke image — fixed width, full header height */
.burke-img {
  width: 130px;
  height: 130px;
  object-fit: cover;
  border-radius: 8px;
  flex-shrink: 0;
  align-self: center;
}

/* Right column: title row, then face+reset row */
.header-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 6px;
  min-width: 0;
}

/* Title — single line */
.header-title {
  font-size: 18px;
  font-weight: 700;
  color: #111;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}

/* Bottom row: photos flex-filling space, reset pinned to right */
.header-bottom {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  flex: 1;
}

/* Faces stretch to fill all available space equally */
.header-faces {
  display: flex;
  flex: 1;
  gap: 10px;
  align-items: flex-end;
  min-width: 0;
}

/* Each source face card takes equal share */
.face-source {
  flex: 1;
  min-width: 0;
  text-align: center;
  cursor: grab;
  user-select: none;
  touch-action: none;
}
.face-source:active { cursor: grabbing; }

/* The image wrapper fills the flex width, square */
.face-source .face-img-wrap {
  width: 100%;
  /* height = width via aspect-ratio trick using padding-bottom */
  aspect-ratio: 1 / 1;
  border-radius: 8px;
}
.face-source .face-name {
  font-size: 10px;
  margin-top: 4px;
  font-weight: 600;
  color: #555;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Reset button — sits to the right of the faces, aligned to bottom */
.reset-btn {
  flex-shrink: 0;
  align-self: flex-end;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 10px 18px;
  font-size: 13px;
  font-weight: 700;
  border: none;
  border-radius: 10px;
  background: #c0392b;
  color: white;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(192,57,43,0.35);
  transition: background 0.15s, transform 0.1s;
  white-space: nowrap;
  height: fit-content;
}
.reset-btn:hover { background: #a93226; }
.reset-btn:active { transform: scale(0.97); }

/* ── PLACED COPIES ── */
.face-copy {
  position: absolute;
  width: 78px;
  text-align: center;
  cursor: grab;
  user-select: none;
  touch-action: none;
  z-index: 50;
}
.face-copy:active { cursor: grabbing; }
.face-copy.dragging { opacity: 0.15; }
.face-copy .face-img-wrap { width: 68px; height: 68px; border-radius: 7px; }
.face-copy .face-name { font-size: 10px; margin-top: 3px; font-weight: 600; color: #555; }
.face-copy .delete-hint { font-size: 8px; color: #ccc; pointer-events: none; margin-top: 1px; }

/* Shared img wrap styles */
.face-img-wrap {
  background: white;
  border: 3px solid #ccc;
  display: block;
  margin: 0 auto;
  overflow: hidden;
  pointer-events: none;
}
.face-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
  pointer-events: none;
}

/* ── PAGE BODY ── */
.page-body {
  position: relative;
  padding: 1rem 1.25rem;
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* ── SPECTRUM SECTIONS ── */
.spectrum-section {
  background: white;
  border-radius: 14px;
  border: 1px solid #ddd;
  padding: 1rem 1.5rem 2.75rem;
  position: relative;
  overflow: visible;
}
.row-header {
  display: flex; align-items: baseline; gap: 8px; margin-bottom: 16px;
}
.row-year { font-size: 26px; font-weight: 700; color: #111; }
.row-desc { font-size: 11px; color: #bbb; }
.spectrum-area {
  position: relative; width: 100%; height: 150px;
}
.track-blue {
  position: absolute; top: 50%; height: 8px;
  border-radius: 4px 0 0 4px; background: #1a56b0;
  transform: translateY(-50%); left: 0;
}
.track-red {
  position: absolute; top: 50%; height: 8px;
  border-radius: 0 4px 4px 0; background: #c0392b;
  transform: translateY(-50%); right: 0;
}
.tick {
  position: absolute; top: calc(50% - 14px);
  width: 3px; height: 36px; background: #888;
  border-radius: 2px; transform: translateX(-50%);
}
.tick-label {
  position: absolute; top: calc(50% + 16px);
  font-size: 11px; color: #888; font-weight: 600;
  transform: translateX(-50%); white-space: nowrap;
}
.edge-label-left {
  position: absolute; top: calc(50% + 16px); left: 0;
  font-size: 11px; color: #1a56b0; font-weight: 700;
}
.edge-label-right {
  position: absolute; top: calc(50% + 16px); right: 0;
  font-size: 11px; color: #c0392b; font-weight: 700;
}

/* ── DRAG GHOST ── */
.drag-ghost {
  position: fixed; pointer-events: none; z-index: 9999;
  text-align: center; opacity: 0.9; width: 78px;
  filter: drop-shadow(0 5px 14px rgba(0,0,0,0.28));
}
.drag-ghost .face-img-wrap { width: 68px; height: 68px; border-radius: 7px; margin: 0 auto; }
.drag-ghost .face-name { font-size: 10px; font-weight: 600; color: #555; margin-top: 3px; }
</style>

let copies = [], copyCounter = 0, dragging = null, ghost = null;

function imgSrc(f) {
  return f.src.startsWith('data:') ? f.src : 'data:image/jpeg;base64,' + f.src;
}

function buildTray() {
  const tray = document.getElementById('tray');
  tray.innerHTML = '';
  FACES.forEach(face => {
    const div = document.createElement('div');
    div.className = 'face-source';

    const wrap = document.createElement('div');
    wrap.className = 'face-img-wrap';
    wrap.style.borderColor = face.border;

    const img = document.createElement('img');
    img.src = imgSrc(face); img.className = 'face-img'; img.draggable = false;

    const name = document.createElement('div');
    name.className = 'face-name'; name.textContent = face.label;

    wrap.appendChild(img); div.appendChild(wrap); div.appendChild(name);

    div.addEventListener('mousedown', e => { if (e.button !== 0) return; e.preventDefault(); startSourceDrag(face, e.clientX, e.clientY); });
    div.addEventListener('touchstart', e => { e.preventDefault(); startSourceDrag(face, e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
    tray.appendChild(div);
  });
}

function makeCopyEl(c) {
  const face = FACES.find(f => f.id === c.faceId);
  const div = document.createElement('div');
  div.className = 'face-copy'; div.dataset.copyId = c.id;
  div.style.left = c.x + 'px'; div.style.top = c.y + 'px';

  const wrap = document.createElement('div');
  wrap.className = 'face-img-wrap'; wrap.style.borderColor = face.border;
  const img = document.createElement('img');
  img.src = imgSrc(face); img.className = 'face-img'; img.draggable = false;
  const name = document.createElement('div');
  name.className = 'face-name'; name.textContent = face.label;
  const hint = document.createElement('div');
  hint.className = 'delete-hint'; hint.textContent = '✕ dbl-click to remove';

  wrap.appendChild(img); div.appendChild(wrap); div.appendChild(name); div.appendChild(hint);

  div.addEventListener('mousedown', e => { if (e.button !== 0) return; e.preventDefault(); startCopyDrag(c.id, face, e.clientX, e.clientY); });
  div.addEventListener('touchstart', e => { e.preventDefault(); startCopyDrag(c.id, face, e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});

  let tapTimer = null;
  div.addEventListener('dblclick', () => removeCopy(c.id));
  div.addEventListener('touchend', () => {
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; removeCopy(c.id); }
    else tapTimer = setTimeout(() => { tapTimer = null; }, 300);
  });
  return div;
}

function renderCopies() {
  document.querySelectorAll('.face-copy').forEach(el => el.remove());
  copies.forEach(c => document.body.appendChild(makeCopyEl(c)));
}
function removeCopy(id) { copies = copies.filter(c => c.id !== id); renderCopies(); }

function createGhost(face) {
  ghost = document.createElement('div'); ghost.className = 'drag-ghost';
  const wrap = document.createElement('div');
  wrap.className = 'face-img-wrap'; wrap.style.borderColor = face.border;
  const img = document.createElement('img');
  img.src = imgSrc(face); img.className = 'face-img'; img.draggable = false;
  const name = document.createElement('div');
  name.className = 'face-name'; name.textContent = face.label;
  wrap.appendChild(img); ghost.appendChild(wrap); ghost.appendChild(name);
  document.body.appendChild(ghost);
}
function moveGhost(cx, cy) {
  if (!ghost) return;
  ghost.style.left = (cx - 34) + 'px'; ghost.style.top = (cy - 34) + 'px';
}

function startSourceDrag(face, cx, cy) {
  dragging = { type: 'source', face };
  createGhost(face); moveGhost(cx, cy);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchmove', onTouchMove, {passive:false});
  document.addEventListener('touchend', onTouchEnd);
}
function startCopyDrag(copyId, face, cx, cy) {
  dragging = { type: 'copy', face, copyId };
  document.querySelectorAll(`.face-copy[data-copy-id="${copyId}"]`).forEach(el => el.classList.add('dragging'));
  createGhost(face); moveGhost(cx, cy);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchmove', onTouchMove, {passive:false});
  document.addEventListener('touchend', onTouchEnd);
}
function onMove(e) { moveGhost(e.clientX, e.clientY); }
function onTouchMove(e) { e.preventDefault(); moveGhost(e.touches[0].clientX, e.touches[0].clientY); }
function onUp(e) { endDrag(e.clientX, e.clientY); }
function onTouchEnd(e) { endDrag(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }

function endDrag(cx, cy) {
  document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp);
  document.removeEventListener('touchmove', onTouchMove); document.removeEventListener('touchend', onTouchEnd);
  if (ghost) { ghost.remove(); ghost = null; }
  if (!dragging) return;
  const { type, face, copyId } = dragging; dragging = null;

  const tray = document.getElementById('tray');
  const tr = tray.getBoundingClientRect();
  const onTray = cx >= tr.left && cx <= tr.right && cy >= tr.top && cy <= tr.bottom;
  if (onTray && type === 'copy') { removeCopy(copyId); return; }
  if (onTray) return;

  const x = cx + window.scrollX - 34, y = cy + window.scrollY - 34;
  if (type === 'source') copies.push({ id: ++copyCounter, faceId: face.id, x, y });
  else { const c = copies.find(c => c.id === copyId); if (c) { c.x = x; c.y = y; } }
  renderCopies();
}

function resetAll() { copies = []; renderCopies(); }
buildTray();
</script>
